<html><body style="font-family:-apple-system,Helvetica;font-size:13px">
<h2>Installed</h2>
<p>Restart the Mac, then power on the FW1814. Open <b>OpenAudio FW1814</b> from Applications for the control panel; the interface appears in Audio MIDI Setup as <i>FireWire 1814 Multichannel</i>.</p>
<p>To remove the driver run <code>sudo /Library/Application\ Support/OpenAudio/uninstall.sh</code>.</p>
</body></html>
