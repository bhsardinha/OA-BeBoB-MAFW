<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Panel Mockup</title>
<!--
  PANEL_REDESIGN_PLAN_v3 companion: the "Advanced" window of the panel (opened from the menu bar), FireWire 1814 only, 44.1/48 kHz only,
  with four modes (DAW, Monitor, Console, Hybrid) for one unit or two FW1814s used as one Core Audio aggregate (32 in / 24 out).
  Channel counts: kext FW1814Tables.h kFW1814ADAT44_48 (16 in / 12 out per unit). Meters are simulated; nothing talks to a driver.
  Palette and type: control-panel/Sources/Theme.swift. Start state from the URL: #mode=daw|monitor|console|hybrid&scope=A|B|dual&rate=96000
-->
<style>
:root{
  --chrome:#0B0C0D;--window:#101113;--surface:#191B1E;--raised:#202327;--control:#272A2F;--controlHi:#33373D;
  --well:#08090A;--track:#2C3035;--ledOff:#24272B;--hair:rgba(255,255,255,.06);
  --text:#ECEEF1;--text2:#A4AAB2;--text3:#6B717A;--text4:#43474E;
  --accent:#62AEFF;--mute:#E5484D;--solo:#F1B33A;--green:#3DC97B;--red:#EF5248;
  --mLow:#33CF7D;--mMid:#EFC43B;--mHigh:#F2493F;--cap:#D9DCE0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:#050606;color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.page{padding:20px 16px 64px;display:flex;flex-direction:column;align-items:center;gap:14px}
.intro{max-width:1160px;text-align:center;color:var(--text2);font-size:12.5px}
.intro h1{margin:0 0 4px;font-size:17px;color:var(--text);font-weight:650}
.intro a{color:var(--accent)}
.top{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.menu{width:262px;background:rgba(36,38,42,.96);border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 14px 40px rgba(0,0,0,.6);padding:5px;font-size:13px;color:#e9eaec}
.menu .mi{padding:3px 10px;border-radius:5px;display:flex;justify-content:space-between;white-space:nowrap}
.menu .mi.hl{background:#2f6fd6;color:#fff}
.menu .mi.dis{color:#6b6e74}
.menu .mi kbd{font:inherit;opacity:.65}
.menu .sep{height:1px;background:rgba(255,255,255,.1);margin:5px 8px}
.menu .mcap{font-size:11px;color:#8b8f96;padding:6px 10px 2px}
.ctl{display:flex;flex-direction:column;gap:9px;max-width:420px;font-size:12px;color:var(--text2)}
.ctl .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl .lbl{color:var(--text3);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;width:62px}
.tb{background:var(--control);border-radius:7px;padding:6px 11px;font-size:12px;color:var(--text2)}
.tb.on{background:var(--controlHi);color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.scroller{max-width:100%;overflow-x:auto;padding:4px}
.win{position:relative;width:1280px;height:720px;background:var(--window);border-radius:11px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.6);overflow:hidden;user-select:none;-webkit-user-select:none}
#wi{position:absolute;inset:0}
#pops{position:absolute;inset:0;pointer-events:none}
#pops>*{pointer-events:auto}

/* header + mode bar */
.hdr{height:52px;background:var(--chrome);display:flex;align-items:center;gap:8px;padding:0 12px}
.lights{display:flex;gap:8px;margin-right:4px}.lights i{width:12px;height:12px;border-radius:50%;background:#34373c;display:block}
.dev{display:flex;flex-direction:column;line-height:1.15;padding:4px 8px;margin-right:4px;white-space:nowrap}
.dev b{font-size:14px;font-weight:650}.dev span{font-size:10.5px;color:var(--text3)}
.mseg{display:flex;background:var(--raised);border-radius:10px;padding:3px;gap:2px}
.mseg button{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;color:var(--text2);font-size:12.5px;font-weight:600;white-space:nowrap}
.mseg button:hover{background:var(--control)}
.mseg button.on{background:var(--controlHi);color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mseg .plus{padding:0 10px;color:var(--text3);font-size:15px}
.mseg.dis{opacity:.35;pointer-events:none}
.pill{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:15px;background:var(--raised);font-size:12px;color:var(--text2);white-space:nowrap}
.pill b{color:var(--text);font-weight:650}.pill .lock{color:var(--green);font-size:11px}.pill.bad .lock{color:var(--solo)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;flex:none}
.spacer{flex:1}
.knobw{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px 0 4px;border-radius:19px;background:var(--raised);cursor:ns-resize;touch-action:none}
.knob{display:block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3c4047,#23262b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);position:relative;flex:none}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:8px;margin-left:-1px;background:var(--text);border-radius:1px;transform-origin:1px 11px;transform:rotate(var(--rot,0deg))}
.knob.big{width:104px;height:104px;background:radial-gradient(circle at 50% 30%,#41454d,#1f2226 75%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 8px 22px rgba(0,0,0,.5)}
.knob.big::after{top:9px;height:20px;width:4px;margin-left:-2px;border-radius:2px;transform-origin:2px 43px}
.knob.mid{width:68px;height:68px;background:radial-gradient(circle at 50% 30%,#41454d,#1f2226 75%)}
.knob.mid::after{top:6px;height:14px;width:3px;margin-left:-1.5px;transform-origin:1.5px 28px}
.kt{display:flex;flex-direction:column;line-height:1.2}.kt b{font-size:12px}.kt span{font-size:10.5px;color:var(--text3);white-space:nowrap}
.gbtn{height:30px;padding:0 12px;border-radius:8px;background:var(--control);font-size:11.5px;font-weight:700;color:var(--text2);letter-spacing:.04em}
.gbtn.dim.on{background:var(--green);color:#0B0C0D}.gbtn.mute.on{background:var(--mute);color:#fff}
.mbar{height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0D0E10;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.useg{display:flex;background:var(--raised);border-radius:8px;padding:2px;gap:2px;flex:none}
.useg button{height:26px;padding:0 10px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--text2);white-space:nowrap}
.useg button.on{background:var(--controlHi);color:var(--text)}
.useg button.dual.on{background:color-mix(in srgb,var(--accent) 28%,var(--controlHi))}
.mbar b{font-size:12.5px;white-space:nowrap}.mbar span{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hwchip{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2);background:var(--raised);border-radius:12px;padding:4px 10px;white-space:nowrap;flex:none}
.hwchip i{font-style:normal;color:var(--green)}
.hwchip.btn{cursor:pointer}.hwchip.btn:hover{background:var(--controlHi)}
.body{position:absolute;top:90px;left:0;right:0;bottom:0;padding:12px 16px 14px;display:flex;gap:16px}
.zlabel{height:22px;flex:none;font-size:10px;font-weight:650;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
.zlabel .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.card{background:var(--surface);border-radius:10px;padding:10px 12px;position:relative}
.hint{color:var(--text3);font-size:11px;line-height:1.45}

/* meters, faders */
.mbar2{position:relative;flex:1;border-radius:2px;background:linear-gradient(to top,var(--mLow) 0%,var(--mLow) 55%,var(--mMid) 76%,var(--mHigh) 93%);overflow:hidden}
.mbar2 .cv{position:absolute;left:0;right:0;top:0;height:calc((1 - var(--m, 0)) * 100%);background:var(--ledOff)}
.mbar2::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 2px,rgba(8,9,10,.85) 2px 3px)}
.hm{position:relative;height:4px;border-radius:2px;background:linear-gradient(to right,var(--mLow) 0%,var(--mLow) 55%,var(--mMid) 76%,var(--mHigh) 93%);overflow:hidden}
.hm+.hm{margin-top:2px}
.hm .cv{position:absolute;top:0;bottom:0;right:0;width:calc((1 - var(--m, 0)) * 100%);background:var(--ledOff)}
.hm::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0 2px,rgba(8,9,10,.85) 2px 3px)}
.ftrack{position:relative;width:26px;border-radius:5px;background:var(--well);cursor:ns-resize;display:flex;gap:3px;padding:3px 4px;touch-action:none}
.cap{position:absolute;left:-6px;right:-6px;height:12px;border-radius:3px;background:var(--cap);box-shadow:0 1px 3px rgba(0,0,0,.7);top:calc(6px + (100% - 12px) * (1 - var(--p, 1)));transform:translateY(-50%);pointer-events:none}
.cap::after{content:"";position:absolute;left:4px;right:4px;top:5px;height:2px;background:#2A2D31}
.hf{position:relative;height:22px;flex:1;border-radius:5px;background:var(--well);padding:5px 6px;display:flex;flex-direction:column;justify-content:center;cursor:ew-resize;touch-action:none;min-width:40px}
.hf .cap{top:50%;left:calc(6px + (100% - 12px) * var(--p, 1));right:auto;width:11px;height:24px;transform:translate(-50%,-50%)}
.hf .cap::after{left:4.5px;right:auto;top:4px;bottom:4px;width:2px;height:auto}
.sb{width:20px;height:20px;border-radius:5px;background:var(--control);font-size:10px;font-weight:750;color:var(--text3);display:flex;align-items:center;justify-content:center;flex:none}
.sb:hover{background:var(--controlHi)}.sb.m.on{background:var(--mute);color:#fff}.sb.l.on{color:var(--accent)}
.v{font-size:11px;color:var(--text2);width:36px;text-align:right;white-space:nowrap}
.seg{display:flex;gap:3px}
.seg button{flex:1;height:22px;border-radius:6px;background:var(--control);font-size:10.5px;font-weight:650;color:var(--text3);padding:0 7px;white-space:nowrap}
.seg button:hover{background:var(--controlHi)}
.seg button.on{background:var(--c,var(--accent));color:#0B0C0D}
.badge{font-size:8.5px;font-weight:750;padding:1px 5px;border-radius:4px;background:var(--control);color:var(--text2);letter-spacing:.06em}
.badge.mono{background:#2a2f37;color:#cfe3ff}
button.badge:hover{box-shadow:inset 0 0 0 1px var(--text3)}

/* MONITOR */
.msrc{flex:1;min-width:0;display:flex;flex-direction:column}
.ctx{height:32px;flex:none;border-radius:9px;background:var(--surface);display:flex;align-items:center;gap:9px;padding:0 12px;margin-bottom:8px;box-shadow:inset 3px 0 0 var(--bc);overflow:hidden}
.ctx b{font-size:12.5px;white-space:nowrap}.ctx span{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ctx .ut{font-size:10px;font-weight:750;color:#0B0C0D;background:var(--text2);border-radius:4px;padding:1px 5px}
.groups{display:flex;gap:14px;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.group{display:flex;flex-direction:column;min-height:0}
.strips{display:flex;gap:4px;flex:1;min-height:0}
.ms{width:var(--ms,44px);background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:center;padding:7px 0;position:relative;transition:opacity .15s;flex:none}
.ms.st{width:calc(var(--ms,44px) + 20px)}
.ms.out{opacity:.38}.ms.out:hover{opacity:.7}
.ms .nm{font-size:10.5px;font-weight:650;max-width:calc(100% - 4px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms .jk{font-size:8.5px;color:var(--text3);white-space:nowrap}
.inbtn{margin:6px 0 2px;width:calc(100% - 10px);height:17px;border-radius:4px;background:var(--control);font-size:8.5px;font-weight:750;color:var(--text3);letter-spacing:.04em}
.inbtn.on{background:var(--c);color:#0B0C0D}
.ms .fm{flex:1;min-height:90px;display:flex;justify-content:center;margin:6px 0 4px}
.ms .ftrack{width:14px;padding:3px}
.ms.st .ftrack{width:24px}
.ms .ftrack .cap{left:-8px;right:-8px}
.ms .val{font-size:9.5px;color:var(--text2);height:13px}
.pm{height:16px;width:calc(100% - 10px);position:relative;margin:5px 0 0;cursor:ew-resize;touch-action:none}
.pm .tr{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--track)}
.pm .ctr{position:absolute;left:50%;top:4px;width:1px;height:8px;background:var(--text4)}
.pm .h{position:absolute;top:2px;width:8px;height:12px;border-radius:2px;background:var(--text2);margin-left:-4px}
.pm.dis{opacity:.28;cursor:default}
.pm.warn .h{background:var(--solo)}
.pl{font-size:8.5px;color:var(--text3);height:11px;white-space:nowrap}
.pl.warn{color:var(--solo)}
.ms .pmt{font-size:8.5px;color:var(--text3);height:27px;margin-top:5px;display:flex;align-items:center}
.ms .btns{display:flex;gap:2px;margin-top:3px}
.ms .btns .sb{width:17px;height:17px;font-size:9px}
.shared{position:absolute;top:5px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--solo)}
.coll{width:58px;background:var(--surface);border-radius:8px;display:flex;flex-direction:column;align-items:center;padding:8px 0;cursor:pointer;flex:none}
.coll:hover{background:var(--raised)}
.coll .vms{display:flex;gap:2px;flex:1;margin:8px 0;width:40px}
.coll b{font-size:10.5px}.coll span{font-size:9px;color:var(--text3)}
.mmix{width:170px;flex:none;display:flex;flex-direction:column}
.tiles{display:flex;flex-direction:column;gap:6px}
.mt{background:var(--surface);border-radius:10px;padding:8px 10px 9px;cursor:pointer;position:relative}
.mt:hover{background:var(--raised)}
.mt.sel{box-shadow:inset 0 0 0 1.5px var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface))}
.mt.dimu{opacity:.6}
.mt .tn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650;white-space:nowrap}
.mt .tn i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.mt .tn .badge{margin-left:auto}
.mt .ts{font-size:10px;color:var(--text3);margin:3px 0 6px;line-height:1.3}
.mt.compact{padding:6px 9px 7px}.mt.compact .ts{margin:2px 0 4px}
.mt.new{background:transparent;box-shadow:inset 0 0 0 1px var(--text4);color:var(--text2);text-align:center;font-size:12px;padding:8px}
.cap3{font-size:10.5px;color:var(--text2);margin-top:9px;line-height:1.4}
.cap3 .bar{display:flex;gap:3px;margin-top:5px}.cap3 .bar i{flex:1;height:5px;border-radius:2px}
.mout{width:236px;flex:none;display:flex;flex-direction:column;margin-left:30px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.mmix,.mout,.msrc{position:relative;z-index:1}
.oc{background:var(--surface);border-radius:10px;padding:8px 10px 9px;margin-bottom:7px}
.oc .oh{display:flex;align-items:center;gap:6px}
.oc .oh b{font-size:12px;font-weight:650;white-space:nowrap}.oc .oh span{font-size:9.5px;color:var(--text3);white-space:nowrap}
.oc .oh .sb{margin-left:auto}
.oc .seg{margin:7px 0 2px}
.orow{display:flex;align-items:center;gap:6px;margin-top:5px}
.orow .ol{width:38px;font-size:10.5px;color:var(--text2);white-space:nowrap}
.oc .note{font-size:10px;color:var(--text3);margin-top:5px}
.adm{display:flex;gap:3px;height:24px;margin-top:7px}

/* DAW */
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.bridge{background:var(--surface);border-radius:10px;padding:8px 12px 10px;display:flex;flex-direction:column;min-height:0}
.bridge.in{flex:1.15}.bridge.outb{flex:1}
.bg{display:flex;gap:18px;flex:1;min-height:0;margin-top:4px}
.lanes{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;margin-top:4px}
.lane{display:flex;gap:14px;flex:1;min-height:0}
.lane .ln{width:16px;flex:none;display:flex;align-items:center;justify-content:center}
.lane .ln b{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.08em;color:var(--text2);font-weight:700}
.bgrp{display:flex;flex-direction:column;min-height:0}
.bgrp .gl{font-size:9.5px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;font-weight:650;height:14px;white-space:nowrap}
.mcols{display:flex;gap:4px;flex:1;min-height:0}
.mcol{width:var(--mc,48px);display:flex;flex-direction:column;align-items:center;min-height:0}
.mcol .pk{font-size:9.5px;color:var(--text2);height:13px}
.clip{width:22px;height:5px;border-radius:2px;background:var(--ledOff);margin:2px 0 4px;cursor:pointer;flex:none}
.clip.on{background:var(--red);box-shadow:0 0 6px var(--red)}
.mcol .well{flex:1;display:flex;gap:2px;width:16px;background:var(--well);border-radius:4px;padding:2px;min-height:30px}
.mcol .well.st{width:26px}
.mcol .nm{font-size:9.5px;font-weight:600;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcol .ca{font-size:8.5px;color:var(--text3);white-space:nowrap}
.tight .mcol .pk{font-size:8.5px;height:11px}.tight .clip{margin:1px 0 2px;height:4px}.tight .mcol .nm{font-size:9px;margin-top:3px}.tight .mcol .ca{font-size:8px}
.dscale{position:relative;width:20px;flex:none;margin:30px 0 30px}
.dscale i{position:absolute;right:0;font-size:8px;color:var(--text4);font-style:normal;transform:translateY(-50%);top:calc((1 - var(--p)) * 100%)}
.cr{width:300px;flex:none;display:flex;flex-direction:column;gap:9px}
.crk{display:flex;flex-direction:column;align-items:center;padding:12px 12px 12px}
.crk .kv{font-size:21px;font-weight:650;margin-top:8px}.crk .ks{font-size:11px;color:var(--text3)}
.crk .kb{cursor:ns-resize;touch-action:none}
.lab{font-size:9.5px;color:var(--text3);letter-spacing:.09em;text-transform:uppercase;font-weight:650;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.lab .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.prow{display:grid;grid-template-columns:44px 1fr 36px 20px;gap:6px;align-items:center}
.prow+.prow{margin-top:6px}
.prow .pn{font-size:11px;color:var(--text2);white-space:nowrap}
.prow .seg{grid-column:2 / span 3;margin-bottom:2px}
.status{font-size:11px;color:var(--text3);display:flex;gap:16px;align-items:center;padding:0 2px;white-space:nowrap;overflow:hidden}
.status b{color:var(--text2);font-weight:600}

/* CONSOLE */
.cwrap{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.ctop{display:flex;align-items:center;gap:10px;height:36px;flex:none}
.tog{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;background:var(--surface);font-size:12px;color:var(--text2);white-space:nowrap}
.tog.on{box-shadow:inset 0 0 0 1px var(--accent);color:var(--text)}
.tog .sw{width:26px;height:15px;border-radius:8px;background:var(--control);position:relative}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--text3);transition:left .15s}
.tog.on .sw{background:var(--accent)}.tog.on .sw::after{left:13px;background:#fff}
.chipw{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;background:var(--surface);font-size:12px;color:var(--text2);white-space:nowrap}
.chipw select{background:var(--well);color:var(--text);border:0;border-radius:5px;font:inherit;padding:3px 4px}
.chipw.warn{box-shadow:inset 0 0 0 1px rgba(241,179,58,.55)}.chipw.warn b{color:var(--solo)}
.chipw button{color:var(--accent);font-size:11.5px}
.ctabs{display:flex;gap:14px;flex:1;min-height:0}
.ctab{flex:1;background:var(--surface);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.crow{display:grid;grid-template-columns:112px 66px 50px 1fr 38px 10px;align-items:center;gap:8px;height:26px}
.tightc .crow{grid-template-columns:96px 52px 46px 1fr 34px 8px;gap:6px;height:19px}

<body>
<div class="page">
  <div class="intro">
    <h1>Advanced panel: FireWire 1814 at 44.1 / 48 kHz, one or two units (mockup v2)</h1>
    A separate window opened from the menu bar; the standard panel stays as it is. Companion of <code>docs/PANEL_REDESIGN_PLAN_v3.md</code>.
    Earlier sketches: <a href="PANEL_MODES_MOCKUP_v1.html">modes v1</a>, <a href="PANEL_FLOW_MOCKUP_v1.html">flow v1</a>. Meters are simulated.
  </div>
  <div class="top">
    <div class="menu" id="menu"></div>
    <div class="ctl" id="ctl"></div>
  </div>
  <div class="scroller"><div class="win" id="win"><div id="wi"></div><div id="pops"></div></div></div>
  <div class="notes" id="notes"></div>
</div>
<script>
'use strict';
const NEG = -Infinity;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dbToP = db => (db === NEG || db <= -64) ? 0 : Math.min(1, Math.pow(10, db / 40));
const linP = db => (db === NEG) ? 0 : clamp((db + 60) / 60, 0, 1);
function pToDb(p) { if (p <= 0.035) return NEG; const d = 40 * Math.log10(p); return d > -0.4 ? 0 : Math.round(d * 2) / 2; }
const fmt = db => db === NEG ? '−∞' : db === 0 ? '0.0' : (db > 0 ? '+' : '−') + Math.abs(db).toFixed(1);
const panTxt = v => Math.abs(v) < 0.004 ? 'C' : (v < 0 ? 'L' : 'R') + Math.round(Math.abs(v) * 127);
const pw = db => db === NEG ? 0 : Math.pow(10, db / 10);
const todb = p => p <= 1e-9 ? NEG : 10 * Math.log10(p);
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
function wave(key, t) {
  const h = hash(key);
  return 4 * Math.sin(t * 0.0019 * (0.6 + h) + h * 40) + 3 * Math.sin(t * 0.0053 * (0.7 + h) + h * 90) + (Math.random() - 0.5) * 2.5 + (Math.sin(t * 0.0007 + h * 7) > 0.86 ? 5 : 0);
}

// ---------- the two units (FW1814, ADAT in/out, 48 kHz) ----------
// Per unit, Core Audio: inputs 1-8 analog, 9-16 ADAT; outputs 1-4 analog, 5-12 ADAT (kext FW1814Tables.h kFW1814ADAT44_48).
// Dual: one macOS aggregate device, unit A first: inputs 1-16 A, 17-32 B; outputs 1-12 A, 13-24 B.
const JACKS = ['Mic/Line 1', 'Mic/Line 2', 'Line 3', 'Line 4', 'Line 5', 'Line 6', 'Line 7', 'Line 8', 'ADAT 1', 'ADAT 2', 'ADAT 3', 'ADAT 4', 'ADAT 5', 'ADAT 6', 'ADAT 7', 'ADAT 8'];
const LOCAL = ['in1', 'in2', 'in3', 'in4', 'in5', 'in6', 'in7', 'in8', 'ad1', 'ad2', 'ad3', 'ad4', 'ad5', 'ad6', 'ad7', 'ad8'];
function mkUnit(key, p, tag, caIn, caOut, sigs, names, daw) {
  return {key, p, tag, caIn, caOut, daw, inputs: LOCAL.map((l, i) => ({id: p + l, jack: JACKS[i], n: i + 1, sig: sigs[i], name: names[i]}))};
}
const UNITS = {
  A: mkUnit('A', '', '74B9FB', 0, 0, [-11, -16, -7, -19, -21, -17, -18, -18.5, -20, -21, -15, -19, null, null, null, null],
            ['Kick In', 'Kick Out', 'Snare Top', 'Snare Bot', 'Hi-hat', 'Tom', 'OH L', 'OH R', 'Room L', 'Room R', 'Bass DI', 'Guitar', 'ADAT 5', 'ADAT 6', 'ADAT 7', 'ADAT 8'],
            [-14, -15, -20, -21, -18, -19, -24, -25, null, null, -22, -23]),
  B: mkUnit('B', 'b_', 'demo', 16, 12, [-15, -15.5, -12, -14, -16, -22, null, null, -19, -19, null, null, null, null, null, null],
            ['Keys L', 'Keys R', 'Vocal', 'Gtr amp', 'Bass amp', 'Perc', 'Spare 7', 'Spare 8', 'Synth L', 'Synth R', 'ADAT 3', 'ADAT 4', 'ADAT 5', 'ADAT 6', 'ADAT 7', 'ADAT 8'],
            [-17, -18, -21, -22, null, null, null, null, null, null, null, null]),
};
const DUAL_MODES = ['daw', 'console'];                 // Dual (two FW1814s as one aggregate) offers these modes only (user, 2026-10-27)
const unitOfMix = id => ['kys', 'voc', 'gtr'].includes(id) ? 'B' : 'A';
const MODES = [
  {id: 'daw', name: 'DAW', title: 'Everything in the DAW', desc: 'you monitor through the DAW; the panel is meters and a control room',
   hw: 'Interface mixer: passthrough · DAW 1–4 → Line 1–4 at 0 dB · inputs not monitored',
   icon: '<svg width="14" height="13" viewBox="0 0 14 13" fill="currentColor"><rect x="1" y="5" width="2" height="7"/><rect x="4.5" y="2" width="2" height="10"/><rect x="8" y="6" width="2" height="6"/><rect x="11.5" y="3.5" width="2" height="8.5"/></svg>'},
  {id: 'monitor', name: 'Monitor', title: 'Direct monitoring', desc: 'cue mixes inside the interface, zero latency, mono first',
   hw: 'Interface mixer: cue mixes on Mix 1/2 · Mix 3/4 · Aux',
   icon: '<svg width="14" height="13" viewBox="0 0 14 13" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8V6.5a5 5 0 0110 0V8"/><rect x="1.2" y="7.5" width="2.6" height="4.3" rx="1"/><rect x="10.2" y="7.5" width="2.6" height="4.3" rx="1"/></svg>'},
  {id: 'console', name: 'Console', title: 'External mixer', desc: 'the 1814 as a converter for an analog console',
   hw: 'Passthrough at unity · every interface level locked at 0 dB',
   icon: '<svg width="14" height="13" viewBox="0 0 14 13" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 1v11M7 1v11M11 1v11"/><rect x="1.5" y="7" width="3" height="2.4" fill="currentColor"/><rect x="5.5" y="3" width="3" height="2.4" fill="currentColor"/><rect x="9.5" y="8.5" width="3" height="2.4" fill="currentColor"/></svg>'},
  {id: 'hybrid', name: 'Hybrid', title: 'Outboard and reamp', desc: 'DAW → outboard → DAW loops with send/return meters and level match',
   hw: 'Passthrough · loop sends at unity · loop returns kept out of the cue mixes',
   icon: '<svg width="14" height="13" viewBox="0 0 14 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h7a2.5 2.5 0 010 5h-6"/><path d="M8 2.5l2 2-2 2"/><path d="M5 7.5l-2 2 2 2"/></svg>'},
];

// ---------- state ----------
let st;
function unitState(u) {
  const A = u === 'A';
  return {
    mixes: A ? [{id: 'mon', name: 'Monitors', mono: false, bus: '12', c: '#62AEFF'}, {id: 'drm', name: 'Drummer', mono: true, bus: '34', c: '#B18CFF'}, {id: 'bas', name: 'Bass player', mono: true, bus: 'aux', c: '#3DC97B'}]
             : [{id: 'kys', name: 'Keys player', mono: false, bus: '12', c: '#2FD4C4'}, {id: 'voc', name: 'Singer', mono: true, bus: '34', c: '#FF7EB6'}, {id: 'gtr', name: 'Guitarist', mono: true, bus: 'aux', c: '#FF9F5A'}],
    sel: A ? 'drm' : 'voc',
    sends: A ? {mon: {r12: 0}, drm: {in1: -3, in2: -9, in3: -2, in4: -14, in5: -10, in6: -8, in7: -9, in8: -9, r34: -4}, bas: {in1: -4, in3: -7, in7: -14, in8: -14, ad3: 0, r12: -8}}
             : {kys: {b_in1: 0, b_in2: 0, r12: -6}, voc: {b_in3: -2, b_in1: -10, b_in2: -10, r12: -8}, gtr: {b_in4: -3, b_in3: -9, r12: -8}},
    pans: A ? {} : {b_in1: -1, b_in2: 1},                             // default centre; the Keys player mix pans the keys hard L/R
    last: {}, chMute: {}, adatOpen: false,
    outSrc: A ? {l12: 'mon', l34: 'drm', hp1: 'drm', hp2: 'bas'} : {l12: 'kys', l34: 'voc', hp1: 'voc', hp2: 'gtr'},
    outLvl: {l1: -20, l2: -20, l3: -12, l4: -12, hp1: -16, hp2: -14}, outLink: {l12: true, l34: !A}, outMute: {},
    room: {mon: A ? -20 : -24, spk: 'A', hp1Src: '12', hp2Src: '34', hp1: -16, hp2: -14, hp1Mute: false, hp2Mute: false},
    conHp: -20,
  };
}
function initState() {
  st = {two: true, scope: 'A', mode: 'daw', rate: 48000, mute: false, dim: false, pop: null, sheet: null, toast: null,
        U: {A: unitState('A'), B: unitState('B')}, monUnit: 'A',
        con: {ref: -18, locked: true, labels: {}},
        loops: [
          {id: 'L1', name: 'Vocal comp', dev: '1176', fmt: 'mono', send: ['out 3', 'Line out 3'], ret: ['Line in 5', 'in 5'], sig: 'A3', inId: 'in5', gain: -1.6, lock: true, mon: false, unit: 'A'},
          {id: 'L2', name: 'Reamp', dev: 'Reamp → amp → SM57', fmt: 'mono', send: ['out 4', 'Line out 4'], ret: ['Mic in 1', 'in 1'], sig: 'A4', inId: 'in1', gain: 3.4, lock: true, mon: false, unit: 'A'},
          {id: 'L3', name: 'Plate reverb', dev: 'Lexicon via ADAT', fmt: 'stereo', send: ['out 5–6', 'ADAT out 1–2'], ret: ['ADAT in 1–2', 'in 9–10'], sig: 'A5', inId: 'ad1', gain: -6.2, lock: true, mon: false, unit: 'A'},
          {id: 'L4', name: 'Bus comp', dev: 'SSL-style comp', fmt: 'stereo', send: ['out 1–2', 'Line out 1–2'], ret: ['Line in 7–8', 'in 7–8'], sig: 'B1', inId: 'b_in7', gain: -0.8, lock: true, mon: false, unit: 'B'},
        ],
        clips: {}, holds: {}};
}
const dual = () => st.scope === 'dual';
const curU = () => dual() ? (st.mode === 'monitor' ? st.monUnit : 'A') : st.scope;      // the unit a single-unit view shows
const mixById = (u, id) => st.U[u].mixes.find(m => m.id === id);
const isMember = (u, mix, ch) => { const s = st.U[u].sends[mix] || {}; return s[ch] !== undefined && s[ch] !== NEG; };
const BUS_LABEL = {'12': 'Mix 1/2', '34': 'Mix 3/4', aux: 'Aux'};
// Core Audio channel numbers as the DAW sees them: per unit alone, or in the aggregate (B after A)
const caIn = (u, n) => (dual() ? UNITS[u].caIn : 0) + n;
const caOut = (u, n) => (dual() ? UNITS[u].caOut : 0) + n;
const uTag = u => dual() ? u + ' · ' : '';
const shortJack = j => j.replace('Mic/Line ', 'In ').replace('Line ', 'In ').replace('ADAT ', 'A');
const locked = () => st.rate <= 48000;

// ---------- header + mode bar ----------
function knobInfo() {
  const u = st.U[curU()];
  switch (st.mode) {
    case 'monitor': return {label: `Knob ${dual() ? curU() + ' ' : ''}→ Line 1/2`, get: () => u.outLvl.l1, set: v => { u.outLvl.l1 = v; if (u.outLink.l12) u.outLvl.l2 = v; }};
    case 'console': return {label: 'Knob → Phones · lines locked', get: () => u.conHp, set: v => { u.conHp = v; }};
    default: return {label: `Knob ${dual() ? 'A ' : ''}→ Monitor`, get: () => u.room.mon, set: v => { u.room.mon = v; }};
  }
}
function header() {
  const k = knobInfo();
  const clock = dual() ? `<span>A internal → word clock → B</span><span class="lock">both locked</span>` : `<span>Internal · ADAT in/out</span><span class="lock">locked</span>`;
  return `<div class="hdr">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="dev"><b>${dual() ? 'Dual FireWire 1814' : 'FireWire 1814 · ' + st.scope}</b><span>Advanced · ${dual() ? '32 in / 24 out' : '16 in / 12 out'}</span></div>
    <div class="mseg ${locked() ? '' : 'dis'}">${MODES.map(m => { const off = dual() && !DUAL_MODES.includes(m.id); return `<button class="${m.id === st.mode ? 'on' : ''}" ${off ? 'disabled style="opacity:.3;cursor:default"' : ''} data-act="mode" data-v="${m.id}" title="${off ? 'Dual: DAW and Console only' : m.title}">${m.icon}${m.name}</button>`; }).join('')}<button class="plus" data-act="pop" data-pop="newmode" title="New mode">＋</button></div>
    <div class="spacer"></div>
    <div class="pill ${locked() ? '' : 'bad'}"><span class="dot" style="${locked() ? '' : 'background:var(--solo)'}"></span><b class="num">${st.rate === 48000 ? '48' : st.rate / 1000} kHz</b>${clock}</div>
    <div class="knobw" data-drag="knob" title="The front Level Controller: drag to turn"><span class="knob" data-knob></span><span class="kt"><b class="num" data-val="knob"></b><span>${k.label}</span></span></div>
    <button class="gbtn dim ${st.dim ? 'on' : ''}" data-act="gdim">DIM</button>
    <button class="gbtn mute ${st.mute ? 'on' : ''}" data-act="gmute">MUTE</button>
  </div>`;
}
function modeBar() {
  const m = MODES.find(x => x.id === st.mode);
  const useg = st.two ? `<div class="useg">${[['A', 'A · 74B9FB'], ['B', 'B · demo'], ['dual', 'A + B · Dual']].map(([v, t]) => `<button class="${v === st.scope ? 'on' : ''} ${v === 'dual' ? 'dual' : ''}" data-act="scope" data-v="${v}">${t}</button>`).join('')}</div>` : '';
  const chip = dual() ? `<div class="hwchip btn" data-act="pop" data-pop="dualsetup" data-popa="dualsetup">Dual setup<i>✓ ready</i></div>` : `<div class="hwchip">${m.hw}<i>✓ applied</i></div>`;
  return `<div class="mbar">${useg}<b>${m.title}</b><span>— ${m.desc}</span>${chip}</div>`;
}

// ---------- MONITOR ----------
function monoStrip(u, c) {
  const U = st.U[u], mix = mixById(u, U.sel), on = isMember(u, mix.id, c.id), v = on ? U.sends[mix.id][c.id] : NEG;
  const pair = b => b === '12' || b === '34';
  const others = U.mixes.filter(o => o.id !== mix.id && pair(o.bus) && isMember(u, o.id, c.id));
  const shared = pair(mix.bus) && others.length > 0;
  // Pan (user, 2026-10-27): every mono source has a pan. Mono mix: greyed at centre. Stereo mix (Mix 1/2 or 3/4): active, centre by
  // default, full left / full right possible. The Aux has no pan (hardware). The pan is shared by Mix 1/2 and Mix 3/4: when a source in
  // a mono mix is panned by a stereo mix, the handle turns amber and says so.
  const pv = U.pans[c.id] || 0;
  const panOn = !mix.mono && pair(mix.bus);
  const stereoOwner = others.find(o => !o.mono);
  const conflict = !panOn && pair(mix.bus) && on && Math.abs(pv) > 0.004 && stereoOwner;
  const shownPan = panOn || conflict ? pv : 0;
  const tip = panOn ? 'Pan in this stereo mix (centre by default)' : mix.bus === 'aux' ? 'The Aux has no pan (hardware)' : conflict ? `Pan set by ${stereoOwner.name} (one pan per channel for Mix 1/2 and 3/4): not centred here` : 'Mono mix: centred';
  const pan = `<div class="pm ${panOn ? '' : 'dis'} ${conflict ? 'warn' : ''}" ${panOn ? `data-drag="pan" data-ch="${c.id}"` : ''} title="${tip}"><div class="tr"></div><div class="ctr"></div><div class="h" style="left:${(shownPan + 1) * 50}%"></div></div><div class="pl ${conflict ? 'warn' : ''}">${panOn || conflict ? panTxt(pv) : 'C'}</div>`;

function dawStrip(u, id) {

function mixTile(u, m, compact) {

  const sel = U.sel === m.id && (!dual() || st.monUnit === u);
  return `<div class="mt ${sel ? 'sel' : ''} ${compact ? 'compact' : ''} ${dual() && st.monUnit !== u ? 'dimu' : ''}" style="--c:${m.c}" data-act="sel" data-u="${u}" data-mix="${m.id}" data-tile="${m.id}">
    <div class="tn"><i></i>${m.name}<button class="badge ${m.mono ? 'mono' : ''}" data-act="mono" data-u="${u}" data-mix="${m.id}" title="Mono or stereo mix">${m.mono ? 'MONO' : 'STEREO'}</button></div>
    <div class="ts">${BUS_LABEL[m.bus]} · → ${dests.join(', ') || 'no output'}</div>
    <div class="hm" data-m="mx:${m.id}:0"><div class="cv"></div></div>${m.mono ? '' : `<div class="hm" data-m="mx:${m.id}:1"><div class="cv"></div></div>`}</div>`;
}
function viewMonitor() {
  const u = curU(), U = st.U[u], mix = mixById(u, U.sel), unit = UNITS[u];
  const n = unit.inputs.filter(c => isMember(u, mix.id, c.id)).length + ['r12', 'r34'].filter(r => isMember(u, mix.id, r)).length;
  const where = mix.bus === 'aux' ? 'on the Aux: its own send per channel, no pan' : (mix.mono ? `on ${BUS_LABEL[mix.bus]}, pans centred: the same signal in both ears` : `on ${BUS_LABEL[mix.bus]}, stereo: pan each source`);
  const analog = unit.inputs.slice(0, 8), adat = unit.inputs.slice(8);
  const adatHtml = U.adatOpen
    ? `<div class="group"><div class="zlabel">${uTag(u)}ADAT in <button class="r" style="color:var(--accent)" data-act="adat" data-u="${u}">collapse</button></div><div class="strips">${adat.map(c => monoStrip(u, c)).join('')}</div></div>`

  const tiles = dual()
    ? ['A', 'B'].map(x => `<div class="zlabel" style="margin-top:${x === 'B' ? 6 : 0}px">Unit ${x}</div>${st.U[x].mixes.map(m => mixTile(x, m, true)).join('')}`).join('')
    : U.mixes.map(m => mixTile(u, m, false)).join('') + `<div class="mt new" data-act="pop" data-pop="newmix" data-popa="newmix">＋ New mix</div>`;
  const outCard = (id, name, sub, chans, allowedBus) => {
    const allowed = U.mixes.filter(m => allowedBus.includes(m.bus)), src = mixById(u, U.outSrc[id]);
    const linked = chans.length === 2 && U.outLink[id], rows = linked ? [chans] : chans.map(c => [c]);
    return `<div class="oc" data-card="${id}"><div class="oh"><b>${uTag(u)}${name}</b><span>${sub}</span>${chans.length === 2 ? `<button class="sb l ${linked ? 'on' : ''}" data-act="olink" data-u="${u}" data-o="${id}" title="${linked ? 'Linked: one fader' : 'Two mono outputs'}">⛓</button>` : ''}</div>
      <div class="seg">${allowed.map(m => `<button class="${m.id === src.id ? 'on' : ''}" style="--c:${m.c}" data-act="osrc" data-u="${u}" data-o="${id}" data-mix="${m.id}">${m.name}</button>`).join('')}</div>
      ${rows.map(r => `<div class="orow"><span class="ol">${r.length === 2 ? 'L · R' : r[0].replace('l', 'Line ').replace('hp', 'Ph ')}</span><div class="hf" data-drag="olvl" data-u="${u}" data-o="${r.join(',')}">${r.map(c => `<div class="hm" data-m="o:${UNITS[u].p}${c}"><div class="cv"></div></div>`).join('')}<div class="cap" data-cap="olvl:${u}:${r[0]}"></div></div><span class="v num" data-val="olvl:${u}:${r[0]}"></span><button class="sb m ${U.outMute[r[0]] ? 'on' : ''}" data-act="omute" data-u="${u}" data-o="${r.join(',')}">M</button></div>`).join('')}

      <div class="groups">

    <div class="mout"><div class="zlabel">Outputs${dual() ? ' · unit ' + u : ''}</div>

// ---------- DAW ----------
function meterCol(key, name, ca, stereo) {
  return `<div class="mcol"><div class="pk num" data-pk="${key}">−∞</div><div class="clip" data-clip="${key}" data-act="clip" data-k="${key}" title="Clip: click to clear"></div>
    <div class="well ${stereo ? 'st' : ''}">${(stereo ? [key + ':0', key + ':1'] : [key]).map(k => `<div class="mbar2" data-m="${k}"><div class="cv"></div></div>`).join('')}</div>
    <div class="nm">${name}</div><div class="ca">${ca}</div></div>`;
}
const dscale = (m = '30px 0 30px') => `<div class="dscale" style="margin:${m}">${[0, -6, -12, -24, -48].map(d => `<i style="--p:${dbToP(d)}">${d}</i>`).join('')}</div>`;
function inputCols(u) { return UNITS[u].inputs.map(c => meterCol('i:' + c.id, c.name, `${shortJack(c.jack)} → ${caIn(u, c.n)}`, false)); }
function outputCols(u) {
  const p = UNITS[u].p, R = st.U[u].room;
  const lines = [1, 2, 3, 4].map(i => meterCol(`o:${p}l${i}`, 'Line ' + i, 'DAW ' + caOut(u, i), false));
  const adat = [1, 2, 3, 4, 5, 6, 7, 8].map(i => meterCol(`o:${p}a${i}`, 'ADAT ' + i, 'DAW ' + caOut(u, i + 4), false));
  const ph = [1, 2].map(i => meterCol(`o:${p}hp${i}`, 'Ph ' + i, R['hp' + i + 'Src'] === '12' ? `DAW ${caOut(u, 1)}/${caOut(u, 2)}` : `DAW ${caOut(u, 3)}/${caOut(u, 4)}`, true));
  return {lines, adat, ph};
}
function phonesRows(u, label) {
  const R = st.U[u].room, ab = caOut(u, 0);
  return [1, 2].map(n => { const k = 'hp' + n; return `<div class="prow"><span class="pn">${label}${n}</span><div class="hf" data-drag="hp" data-u="${u}" data-h="${k}"><div class="hm" data-m="o:${UNITS[u].p}${k}:0"><div class="cv"></div></div><div class="hm" data-m="o:${UNITS[u].p}${k}:1"><div class="cv"></div></div><div class="cap" data-cap="hp:${u}:${k}"></div></div><span class="v num" data-val="hp:${u}:${k}"></span><button class="sb m ${R[k + 'Mute'] ? 'on' : ''}" data-act="hpmute" data-u="${u}" data-h="${k}">M</button>
    <span></span><div class="seg">${[['12', `DAW ${ab + 1}/${ab + 2}`], ['34', `DAW ${ab + 3}/${ab + 4} · cue`]].map(([v, t]) => `<button class="${R[k + 'Src'] === v ? 'on' : ''}" data-act="hpsrc" data-u="${u}" data-h="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`; }).join('');
}
function controlRoom(u, opts) {

      <div class="kb" data-drag="mon" data-u="${u}"><span class="knob ${opts.small ? 'mid' : 'big'}" data-bigknob="${u}"></span></div><div class="kv num" data-val="mon:${u}" style="${opts.small ? 'font-size:17px;margin-top:6px' : ''}"></div>
      ${opts.speakers ? `<div class="seg" style="align-self:stretch;margin-top:10px">${[['A', 'Speakers A · Line 1/2'], ['B', 'B · Line 3/4']].map(([v, t]) => `<button class="${R.spk === v ? 'on' : ''}" data-act="spk" data-u="${u}" data-v="${v}">${t}</button>`).join('')}</div>` : ''}</div>`;

}
function viewDaw() {
  if (!dual()) {

// ---------- CONSOLE ----------
function lmeter(key) {
  const ref = st.con.ref, r = linP(ref) * 100, rd = linP(-3) * 100;
  return `<div class="lm" data-m="${key}" data-lin="1" style="background:linear-gradient(to right,var(--mLow) 0%,var(--mLow) ${r}%,var(--mMid) ${r}%,var(--mMid) ${rd}%,var(--mHigh) ${rd}%)"><div class="ref" style="left:${r}%"></div><div class="cv"></div></div>`;
}
function lscale() {
  const ref = st.con.ref, marks = [-48, -36, -24, ref, -6, 0].filter((v, i, a) => a.indexOf(v) === i);
  return `<div class="lscale">${marks.map(d => `<i class="${d === ref ? 'ref' : ''}" style="left:${linP(d) * 100}%">${d === ref ? '0 VU' : d}</i>`).join('')}</div>`;
}
function inRows(u) {

    return `<div class="crow"><input class="lbl" data-inp="lbl" data-k="${key}" value="${st.con.labels[key] || 'Ch ' + ca + ' · ' + c.name}" spellcheck="false"><span class="jk">${uTag(u)}${c.jack}</span><span class="to">→ DAW ${ca}</span>${lmeter(key)}<span class="pkv num" data-pk="${key}">−∞</span><span class="cdot" data-clip="${key}" data-act="clip" data-k="${key}"></span></div>`; }).join('');
}
function outRows(u) {
  const p = UNITS[u].p;
  const outs = [1, 2, 3, 4].map(i => ['l' + i, 'Line ' + i, i]).concat([1, 2, 3, 4, 5, 6, 7, 8].map(i => ['a' + i, 'ADAT ' + i, i + 4]));
  return outs.map(([id, jack, n]) => { const ca = caOut(u, n), key = `o:${p}${id}`;
    return `<div class="crow"><input class="lbl" data-inp="lbl" data-k="${key}" value="${st.con.labels[key] || 'Return ' + ca}" spellcheck="false"><span class="to">DAW ${ca} →</span><span class="jk">${uTag(u)}${jack}</span>${lmeter(key)}<span class="pkv num" data-pk="${key}">−∞</span><span class="cdot" data-clip="${key}" data-act="clip" data-k="${key}"></span></div>`; }).join('');
}
function viewConsole() {
  const c = st.con;
  const hdr = (a, b, d) => `<div class="crow h"><span>${a}</span><span>${b}</span><span>${d}</span>${lscale()}<span>peak</span><span></span></div>`;
  const clock = dual() ? `<div class="chipw"><span class="dot"></span>A internal → word clock → B · both locked</div>` : `<div class="chipw warn">Clock: <b>Internal</b> · with an ADAT converter as master use External <button data-act="toast" data-v="The panel never changes the clock or the rate by itself.">Change…</button></div>`;
  const top = `<div class="ctop"><button class="tog ${c.locked ? 'on' : ''}" data-act="lock"><span class="sw"></span>Unity lock: every interface level at 0 dB</button>
      <div class="chipw">Meters: 0 VU = <select data-inp="ref">${[-20, -18, -14, -12].map(v => `<option value="${v}" ${v === c.ref ? 'selected' : ''}>${v}</option>`).join('')}</select> dBFS</div>${clock}

  if (!dual()) {

      <div class="ctab"><div class="lab">Console → DAW<span class="r">16 channels · labels are yours</span></div>${hdr('Console label', 'Jack', 'Core Audio')}${inRows(u)}</div>
      <div class="ctab"><div class="lab">DAW → console<span class="r">12 channels · Line 1–4 through the mixer at 0 dB, ADAT direct</span></div>${hdr('Console label', 'Core Audio', 'Jack')}${outRows(u)}${phones(u)}</div>
    </div></div>`;
  }
  return `<div class="cwrap tightc">${top}<div class="ctabs">
      <div class="ctab"><div class="lab">Console → DAW 1–16<span class="r">unit A</span></div>${hdr('Label', 'Jack', 'DAW')}${inRows('A')}</div>
      <div class="ctab"><div class="lab">Console → DAW 17–32<span class="r">unit B</span></div>${hdr('Label', 'Jack', 'DAW')}${inRows('B')}</div>
      <div class="ctab"><div class="lab">DAW 1–24 → console<span class="r">A: 1–12 · B: 13–24</span></div>${hdr('Label', 'DAW', 'Jack')}${outRows('A')}${outRows('B')}${phones('A')}</div>
    </div></div>`;
}

// ---------- HYBRID ----------
function viewHybrid() {
  const loops = st.loops.filter(l => dual() || l.unit === st.scope);
  const unitPfx = l => dual() ? l.unit + ' · ' : '';
  const daw = (l, s) => { const off = dual() && l.unit === 'B' ? 1 : 0; return s.replace(/\d+/g, d => String(+d + (off ? (s.startsWith('in') ? 16 : 12) : 0))); };
  const card = l => `<div class="loop">

const disp = {};

        const pn = U.pans[ch] || 0, a = (pn + 1) * Math.PI / 4;                       // one pan per channel for Mix 1/2 and 3/4 (hardware)
        acc[0] += 2 * q * Math.cos(a) ** 2; acc[1] += 2 * q * Math.sin(a) ** 2;

      mx[m.id] = acc.map(todb); lv[`mx:${m.id}:0`] = mx[m.id][0]; lv[`mx:${m.id}:1`] = mx[m.id][1];
    }
    const out = (o, side, src) => { const v = mx[src][side]; return U.outMute[o] || v === NEG || U.outLvl[o] === NEG ? NEG : gl(Math.min(0, v + U.outLvl[o])); };
    lv[`o:${p}l1`] = out('l1', 0, U.outSrc.l12); lv[`o:${p}l2`] = out('l2', 1, U.outSrc.l12);
    lv[`o:${p}l3`] = out('l3', 0, U.outSrc.l34); lv[`o:${p}l4`] = out('l4', 1, U.outSrc.l34);
    lv[`o:${p}hp1`] = out('hp1', 0, U.outSrc.hp1); lv[`o:${p}hp2`] = out('hp2', 0, U.outSrc.hp2);
    return;
  }
  const R = U.room, unity = st.mode === 'console', mon = unity ? 0 : R.mon, b = !unity && R.spk === 'B';
  const x = k => lv['x:' + u + k];
  lv[`o:${p}l1`] = b ? NEG : gl(x(1) + mon); lv[`o:${p}l2`] = b ? NEG : gl(x(2) + mon);
  lv[`o:${p}l3`] = gl(b ? x(1) + mon : x(3)); lv[`o:${p}l4`] = gl(b ? x(2) + mon : x(4));
  for (let i = 1; i <= 8; i++) lv[`o:${p}a${i}`] = gl(x(i + 4));
  const hp = (k, lvl, src, mute) => { const ks = src === '12' ? [1, 2] : [3, 4]; [0, 1].forEach(s => lv[`o:${p}${k}:${s}`] = mute || lvl === NEG ? NEG : gl(x(ks[s]) + lvl)); };
  if (unity) hp('hp1', U.conHp, '12', false);
  else { hp('hp1', R.hp1, R.hp1Src, R.hp1Mute); hp('hp2', R.hp2, R.hp2Src, R.hp2Mute); }
}
function levels(t) {
  const lv = {};
  unitLevels('A', t, lv); unitLevels('B', t, lv);
  if (st.mode === 'hybrid') for (const l of st.loops) {
    const s = lv['x:' + l.sig], ret = s === NEG ? NEG : Math.min(0, s + l.gain + (Math.random() - 0.5) * 0.4);
    lv[`lp:${l.id}:s`] = s; lv[`lp:${l.id}:r`] = ret; lv['i:' + l.inId] = ret;
  }
  return lv;
}
let lastFrame = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (t - lastFrame < 33) return;
  lastFrame = t;
  const lv = levels(t);
  for (const el of meterEls) {
    const k = el.dataset.m, v = lv[k] === undefined ? NEG : lv[k];
    const prev = disp[k] === undefined ? NEG : disp[k];
    const shown = v >= prev ? v : (prev === NEG ? NEG : prev - 1.6);
    disp[k] = shown < -70 ? NEG : shown;
    el.style.setProperty('--m', el.dataset.lin ? linP(disp[k]) : dbToP(disp[k]));
  }
  for (const k in lv) { const v = lv[k], h = st.holds[k]; if (!h || v >= h.v || t - h.t > 1500) st.holds[k] = {v, t}; if (v >= -0.1) st.clips[k] = true; }
  for (const el of pkEls) { const h = st.holds[el.dataset.pk]; el.textContent = h ? fmt(h.v === NEG ? NEG : Math.round(h.v * 10) / 10) : '−∞'; }
  for (const el of clipEls) el.classList.toggle('on', !!st.clips[el.dataset.clip]);
  for (const el of deltaEls) {
    const l = st.loops.find(x => x.id === el.dataset.delta), s = st.holds[`lp:${l.id}:s`], r = st.holds[`lp:${l.id}:r`];
    if (s && r && s.v !== NEG && r.v !== NEG) { const dd = r.v - s.v; el.textContent = (dd >= 0 ? '+' : '−') + Math.abs(dd).toFixed(1) + ' dB'; el.style.color = Math.abs(dd) < 1 ? 'var(--green)' : 'var(--text)'; }
  }
}

// ---------- notes ----------
document.getElementById('notes').innerHTML = [
  ['Where it lives', 'A separate “Advanced” window, opened from the menu bar menu (⌥⌘A). Only with a FireWire 1814 and only at 44.1 / 48 kHz; at other rates it says why and offers the standard panel, which stays exactly as it is. It opens in DAW mode.'],
  ['One unit or two', 'With two FW1814s the bar under the header picks unit A, unit B, or A + B (Dual). Dual shows both as one Core Audio aggregate: 32 in / 24 out, unit A first.'],
  ['Dual, honestly', 'An extra, not the main view: DAW and Console only, always on a macOS aggregate (the driver exposes each 1814 as its own device, as the official one does, capture 94). One FireWire bus per unit on the Mac Pro; unit B follows A’s word clock.'],
  ['Pan on mono sources', 'Every mono strip has a pan. Going to a mono mix it is greyed at centre; going to a stereo mix it is live, centre by default, full left / full right possible (double-click: centre). The Aux has no pan. Mix 1/2 and 3/4 share one pan per channel: an amber handle shows a source a stereo mix pans away from centre.'],
  ['MONO / STEREO', 'Click the badge on a cue-mix tile to switch it. Switching to mono centres the sources no stereo mix pans.'],
  ['What a mode never does', 'Change the rate, the clock or the digital ports, or raise an output level without asking.'],
].map(([t, d]) => `<div class="note"><h3>${t}</h3>${d}</div>`).join('');

// start
initState();
const hp0 = new URLSearchParams(location.hash.slice(1));
if (MODES.some(m => m.id === hp0.get('mode'))) st.mode = hp0.get('mode');
if (['A', 'B', 'dual'].includes(hp0.get('scope'))) { st.scope = hp0.get('scope'); if (st.scope !== 'dual') st.monUnit = st.scope; }
if (hp0.get('unit')) st.monUnit = hp0.get('unit');
if (hp0.get('rate')) st.rate = +hp0.get('rate');
if (hp0.get('sel')) st.U[st.monUnit].sel = hp0.get('sel');
render();
if (hp0.get('pop')) { st.pop = hp0.get('pop'); renderPops(); }
requestAnimationFrame(frame);
</script>
